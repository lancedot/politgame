<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安然季度股东大会决议</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>安然季度股东大会决议</h1>
    <p class="subtitle">利润是叙事，现金是现实，责任是可转移资产。</p>
  </header>

  <section class="headline-feed panel feed-top">
    <h2>新闻与舆情流</h2>
    <ul id="feed"></ul>
  </section>

  <section class="metrics" id="metrics"></section>
  <section class="motto" id="motto">沟通 · 诚信 · 尊重 · 卓越</section>

  <main class="layout">
    <section class="panel" id="phasePanel">
      <h2>季度战情</h2>
      <p id="phaseInfo"></p>
      <p id="phaseDesc"></p>
      <p id="forecastCompare" class="small"></p>
      <p id="operationHint" class="small"></p>
      <p id="optionInfo" class="small"></p>
      <button id="exerciseBtn">个人期权变现</button>
      <button id="nextQuarterBtn" disabled>发布财报并进入下一季度</button>
    </section>

    <section class="panel" id="timelinePanel">
      <h2>历史时间轴对照</h2>
      <p id="timelineYear" class="small"></p>
      <p id="timelineEvent"></p>
      <p id="timelinePeople" class="small"></p>
      <p id="timelineImpact" class="small"></p>
    </section>

    <section class="panel" id="investigationPanel">
      <h2>调查进度</h2>
      <div class="progress-row"><span>SEC 关注</span><progress id="secBar" max="100" value="0"></progress></div>
      <div class="progress-row"><span>媒体热度</span><progress id="mediaBar" max="100" value="0"></progress></div>
      <div class="progress-row"><span>吹哨压力</span><progress id="whistleBar" max="100" value="0"></progress></div>
      <div class="progress-row"><span>审计独立性下降</span><progress id="auditBar" max="100" value="0"></progress></div>
      <p id="investigationHint" class="small"></p>
    </section>


    

    <section class="panel" id="actionPanel">
      <h2>核心任务</h2>
      <p id="actionIntro"></p>
      <div id="actionArea"></div>
    </section>

    <section class="panel" id="auditPanel">
      <h2>审计沟通</h2>
      <p class="small">审计意见不是数字打印机，但可以是遮羞布。</p>
      <div class="choices" id="auditChoices"></div>
    </section>

    <section class="panel" id="callPanel">
      <h2>分析师会议</h2>
      <p id="callPrompt"></p>
      <div class="choices" id="callChoices"></div>
    </section>

    <section class="panel" id="reportPanel">
      <h2>季度报告生成器</h2>
      <p class="small">商业黑话自动生成，供投资者情绪管理使用。</p>
      <article id="report"></article>
    </section>
  </main>

  <section class="ticker"><div id="tickerTrack"></div></section>

  <div class="overlay hidden" id="randomEvent">
    <div class="ending-card">
      <h2 id="eventTitle"></h2>
      <p id="eventDesc"></p>
      <div class="choices" id="eventChoices"></div>
    </div>
  </div>

  <div class="overlay hidden" id="ending">
    <div class="ending-card">
      <h2 id="endingTitle"></h2>
      <p id="endingDesc"></p>
      <div id="endingDebrief"></div>
      <p id="endingScore"></p>
      <button onclick="location.reload()">重新召开季度会议</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
