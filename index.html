<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enron: 数字恐怖游戏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>ENRON // 数字恐怖游戏</h1>
    <p class="subtitle">硬核模拟 + 黑色幽默：你管理的不是公司，而是坠落速度。</p>
  </header>

  <section class="metrics" id="metrics"></section>
  <section class="motto" id="motto">沟通 · 诚信 · 尊重 · 卓越</section>

  <main class="layout">
    <section class="panel" id="phasePanel">
      <h2>季度战情</h2>
      <p id="phaseInfo"></p>
      <p id="phaseDesc"></p>
      <p id="operationHint" class="small"></p>
      <button id="nextQuarterBtn" disabled>发布财报并进入下一季度</button>
    </section>

    <section class="panel" id="actionPanel">
      <h2>核心任务</h2>
      <p id="actionIntro"></p>
      <div id="actionArea"></div>
    </section>

    <section class="panel" id="callPanel">
      <h2>分析师电话会议（Boss战）</h2>
      <p id="callPrompt">你的回答将受 Charisma 加成，但风险也会同步增长。</p>
      <div class="choices" id="callChoices"></div>
    </section>

    <section class="panel" id="reportPanel">
      <h2>“年度报告”生成器</h2>
      <p class="small">每季度自动生成一段商业黑话，用于麻痹投资者。</p>
      <article id="report"></article>
    </section>

    <section class="panel feed">
      <h2>新闻与舆情流</h2>
      <ul id="feed"></ul>
    </section>
  </main>

  <div class="overlay hidden" id="ending">
    <div class="ending-card">
      <h2 id="endingTitle"></h2>
      <p id="endingDesc"></p>
      <p id="endingScore"></p>
      <button onclick="location.reload()">重开这场骗局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
