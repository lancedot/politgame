<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enron: 数字恐怖游戏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>ENRON // 数字恐怖游戏</h1>
    <p class="subtitle">你不是在做账，你在和监狱赔率赛跑。</p>
  </header>

  <section class="metrics" id="metrics"></section>

  <section class="motto" id="motto">沟通 · 诚信 · 尊重 · 卓越</section>

  <main class="layout">
    <section class="panel" id="phasePanel">
      <h2>季度战情</h2>
      <p id="phaseInfo"></p>
      <p id="pressureInfo"></p>
      <button id="nextQuarterBtn" disabled>结算并进入下一季度</button>
    </section>

    <section class="panel" id="mtmPanel">
      <h2>① MTM 激进会计</h2>
      <p>印度 20 年供电协议：把未来利润一次性记入当季。</p>
      <label for="optimism">乐观进度条（50%-95%）</label>
      <input type="range" id="optimism" min="50" max="95" step="5" value="50" />
      <p id="optimismText"></p>
      <button id="applyMtmBtn">锁定 MTM 决策</button>
    </section>

    <section class="panel" id="auditPanel">
      <h2>② 安达信公关部</h2>
      <p>审计师提出困惑，你要如何“沟通”？</p>
      <div class="choices" id="auditChoices"></div>
    </section>

    <section class="panel" id="callPanel">
      <h2>③ 财报发布会（Boss战）</h2>
      <p>分析师提问：为什么利润和现金流完全背离？</p>
      <div class="choices" id="callChoices"></div>
    </section>

    <section class="panel feed">
      <h2>新闻与舆情流</h2>
      <ul id="feed"></ul>
    </section>
  </main>

  <div class="overlay hidden" id="ending">
    <div class="ending-card">
      <h2 id="endingTitle"></h2>
      <p id="endingDesc"></p>
      <p id="endingScore"></p>
      <button onclick="location.reload()">重开这场骗局</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
