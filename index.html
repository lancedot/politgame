<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安然季度股东大会决议</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>安然季度股东大会决议</h1>
    <p class="subtitle">你管理的是预期、口径与责任的转移速度。</p>
  </header>

  <section class="metrics" id="metrics"></section>
  <section class="motto" id="motto">沟通 · 诚信 · 尊重 · 卓越</section>

  <main class="layout">
    <section class="panel" id="phasePanel">
      <h2>季度战情</h2>
      <p id="phaseInfo"></p>
      <p id="phaseDesc"></p>
      <p id="forecastCompare" class="small"></p>
      <p id="operationHint" class="small"></p>
      <p id="optionInfo" class="small"></p>
      <button id="exerciseBtn">个人期权变现</button>
      <button id="nextQuarterBtn" disabled>发布财报并进入下一季度</button>
    </section>

    <section class="panel" id="actionPanel">
      <h2>核心任务</h2>
      <p id="actionIntro"></p>
      <div id="actionArea"></div>
    </section>

    <section class="panel" id="auditPanel">
      <h2>审计沟通</h2>
      <p class="small">与安达信的关系管理会影响怀疑度与披露口径。</p>
      <div class="choices" id="auditChoices"></div>
    </section>

    <section class="panel" id="callPanel">
      <h2>分析师会议</h2>
      <p id="callPrompt"></p>
      <div class="choices" id="callChoices"></div>
    </section>

    <section class="panel" id="reportPanel">
      <h2>季度报告生成器</h2>
      <p class="small">每季度自动生成一段商业黑话，用于投资者沟通。</p>
      <article id="report"></article>
    </section>

    <section class="panel feed">
      <h2>新闻与舆情流</h2>
      <ul id="feed"></ul>
    </section>
  </main>

  <div class="overlay hidden" id="ending">
    <div class="ending-card">
      <h2 id="endingTitle"></h2>
      <p id="endingDesc"></p>
      <p id="endingScore"></p>
      <button onclick="location.reload()">重新召开季度会议</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
